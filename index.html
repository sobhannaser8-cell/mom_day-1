<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf7ff">
<title>مامانی روزت مبارک ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; }
  body {
    min-height: 100svh; overflow: hidden; display: grid; place-items: center;
    background: #fff; font-family: Tahoma, Arial, sans-serif;
    transition: background 1.8s ease;
  }
  body.celebrating { background: radial-gradient(circle at 50% 42%, #ffffff 0%, #effaff 48%, #dff3ff 100%); }
  .scene { position: relative; width: 100%; min-height: 100svh; display: grid; place-items: center; padding: 22px; }
  .intro { display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(94vw, 720px); transition: opacity 1s ease, transform 1s ease; }
  .envelope {
    display: block; width: 100%; border: 0; padding: 0; background: transparent; cursor: pointer;
    -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 12px 18px rgba(78, 51, 35, .13));
    transition: transform .25s ease, filter .25s ease;
  }
  .envelope:hover { transform: translateY(-4px) scale(1.012); filter: drop-shadow(0 17px 22px rgba(78, 51, 35, .17)); }
  .envelope:active { transform: scale(.985); }
  .envelope img { display: block; width: 100%; height: auto; border-radius: 4px; }
  .hint { margin: 0; color: #c62828; font-size: clamp(19px, 5vw, 27px); font-weight: 700; letter-spacing: .2px; animation: hintPulse 1.8s ease-in-out infinite; }
  @keyframes hintPulse { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
  .intro.fade-out { opacity: 0; transform: scale(.94); pointer-events: none; }
  .heart-wrap { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, 90vh) scale(.35); opacity: 0; pointer-events: none; }
  .heart-wrap.rise { animation: rise 2.05s cubic-bezier(.22,.72,.2,1) forwards; }
  .heart { width: 100%; height: 100%; filter: drop-shadow(0 10px 14px rgba(194, 24, 55, .25)); }
  @keyframes rise {
    0% { transform: translate(-50%, 90vh) scale(.35) rotate(-12deg); opacity: 0; }
    12% { opacity: 1; }
    72% { transform: translate(-50%, -42%) scale(1.12) rotate(5deg); opacity: 1; }
    86% { transform: translate(-50%, -50%) scale(.94) rotate(-3deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  }
  .heart-wrap.pop { animation: pop .48s ease-out forwards; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 35% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(.1); opacity: 0; } }
  .burst { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; pointer-events: none; }
  .particle { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); opacity: 0; box-shadow: 0 0 10px var(--c); }
  .burst.go .particle { animation: burst .95s cubic-bezier(.12,.72,.22,1) forwards; }
  @keyframes burst {
    0% { transform: translate(0,0) scale(.25); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(var(--x),var(--y)) scale(.05); opacity: 0; }
  }
  .message { position: absolute; left: 50%; top: 50%; width: 94%; transform: translate(-50%,-50%) scale(.82); opacity: 0; text-align: center; font-size: clamp(34px, 9vw, 66px); line-height: 1.5; font-weight: 900; color: #ff1744; text-shadow: 0 4px 18px rgba(70,130,180,.14); }
  .message.show { animation: messageIn 1.1s cubic-bezier(.2,.8,.2,1) forwards, rainbow 5s linear 1.1s infinite; }
  @keyframes messageIn { to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  @keyframes rainbow { 0% { color: #ff1744; } 16% { color: #ff9100; } 33% { color: #d4e000; } 50% { color: #00b86b; } 66% { color: #168cff; } 83% { color: #a335e8; } 100% { color: #ff1744; } }
  .tiny-hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: 0; }
  .tiny-hearts.show { opacity: 1; }
  .float-heart { position: absolute; bottom: -40px; color: rgba(255,65,105,.38); font-size: var(--f); animation: floatUp var(--d) linear infinite; animation-delay: var(--delay); left: var(--left); }
  @keyframes floatUp { from { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: .8; } to { transform: translateY(-115vh) rotate(35deg); opacity: 0; } }
  @media (max-width: 480px) { .scene { padding: 16px; } .intro { gap: 18px; } .heart-wrap { width: 100px; height: 100px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>

    <p class="hint">بزن رو نامه</p>
  </section>
  <div class="heart-wrap" id="heartWrap" aria-hidden="true">
    <svg class="heart" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff526b"/><stop offset=".55" stop-color="#e60035"/><stop offset="1" stop-color="#ad002d"/></linearGradient></defs>
      <path d="M50 88 C42 80 8 57 8 32 C8 8 39 2 50 25 C61 2 92 8 92 32 C92 57 58 80 50 88Z" fill="url(#heartGrad)"/>
      <path d="M25 28 C28 17 40 16 46 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".38"/>
    </svg>
  </div>
  <div class="burst" id="burst" aria-hidden="true"></div>
  <h1 class="message" id="message">مامانی روزت مبارک ❤️</h1>
</main>
<script>
  const openButton = document.getElementById('openLetter');
  const intro = document.getElementById('intro');
  const heart = document.getElementById('heartWrap');
  const burst = document.getElementById('burst');
  const message = document.getElementById('message');
  const tinyHearts = document.getElementById('tinyHearts');
  let started = false;

  function makeBurst() {
    const colors = ['#ff1744','#ff5252','#ff8a80','#ffca28','#ff80ab','#ec407a','#ffffff'];
    for (let i = 0; i < 34; i++) {
      const p = document.createElement('span');
      const angle = (Math.PI * 2 * i / 34) + (Math.random() - .5) * .16;
      const distance = 65 + Math.random() * 105;
      p.className = 'particle';
      p.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
      p.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
      p.style.setProperty('--s', `${5 + Math.random() * 8}px`);
      p.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);
      p.style.animationDelay = `${Math.random() * .08}s`;
      burst.appendChild(p);
    }
  }

  openButton.addEventListener('click', () => {
    if (started) return;
    started = true;
    intro.classList.add('fade-out');
    document.body.classList.add('celebrating');
    window.setTimeout(() => {
      intro.style.display = 'none';
      heart.classList.add('rise');
    }, 850);
    window.setTimeout(() => {
      heart.classList.remove('rise');
      heart.classList.add('pop');
      makeBurst();
      burst.classList.add('go');
    }, 3000);
    window.setTimeout(() => {
      message.classList.add('show');
      tinyHearts.classList.add('show');
    }, 3450);
  });
</script>
